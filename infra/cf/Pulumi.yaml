# One project, one stack per deployment branch (`gcs`, `cw-s3`, `hf` here); each branch's cf/ selects only its own
# stack. Distinct project name from gcp/'s so the two don't collide in the shared gs://oa-pulumi backend (keyed by
# <project>/<stack>).
name: gcs-usage-cf
description: Cloudflare resources for the storage-usage dashboards — Pages project shell, custom domain + oa.dev CNAME, D1, cache KV, the R2 index bucket and its tokens. Deployments + app config stay with site/deploy (wrangler).
main: hf_stack.py
backend:
  url: gs://oa-pulumi
runtime:
  name: python
  options:
    toolchain: uv
# The account and zone ids are not declared here: a declared key without a value fails `pulumi preview` before the
# program runs, and this public repo keeps them out of `Pulumi.hf.yaml`; `hf_stack.py` fills them from
# `$CLOUDFLARE_ACCOUNT_ID` / `$CF_ZONE_ID` (the worktree's `.envrc`).
