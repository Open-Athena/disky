# hf's Slack usage digest (`dt-cloud digest -T cw -C job/digest.yml`): the `cw` template (a monthly thread, one reply
# per UTC day), spelled out field by field as cw-s3's `job/digest.yml`. Validated on load: unknown keys raise.
# Secrets stay env-only (`SLACK_BOT_TOKEN`, `SLACK_CHANNEL`; the channel is #hf-usage, set by `job/hf-batch-submit.sh`).
template: cw
title: Hugging Face usage
site_url: https://hf.oa.dev
# R2 (the step passes it as `-r`: job/profiles/hf.yml `options.digest.root`)
root: r2://oa-hf-usage-index/snapshots/hf
# beside `snapshots/`: r2://oa-hf-usage-index/digest/hf/<channel>/<variant>/<YYYY-MM>.json, keyed by channel (a
# staging converge never masquerades as prod) and variant
state: digest/hf/{channel}/{variant}
discord_state: digest/discord/{webhook}
discord_webhook_env: null
# the reply avatars (`arrows/av_deg<N>.png`) are the icons project's production deployment of `job/icons-hf/`
icons_base: https://oa-hf-usage-icons.pages.dev
icons_dir: job/icons-hf
# the month OP's sender icon: hf's mark (`deploy/slack/icons/hf.png` at 256 px), not 📆
op_icon: mark.png
# the OP's plot (drawn by the site, `POST /api/digest-image` with SITE_TOKEN) goes to the icons project's `plot`
# preview branch, never the production alias that serves the avatars
plot_project: oa-hf-usage-icons
plot_branch: plot
plot_base: https://plot.oa-hf-usage-icons.pages.dev
# sender: the headline as the reply's sender name + a trend-arrow avatar. hf scans once a day (the 08:00 UTC cron):
# the reply is the day's first scan from 08Z on that wasn't started by hand (its `trigger.json`), so a manual scan
# (2026-10-17's 02:47 re-run) never preempts the cron's; a day without one gets its last scan once a later day's
# lands, and no provisional reply
variant: sender
reply_hour: 8
provisional: false
# HF bills in decimal TB (the billing page: 15.72 TB of the 253 TB allowance), so the digest speaks TB, not TiB
units: TB
primary: open-athena
# `path: ""`: the site serves the org at its root, not `/open-athena`. The quotas are the org's allowances (billing
# page, 2026-10-14; `HF_ALLOWANCES` in site/src/stores/hf.tsx), each over its storage class (`meta.json`
# `class_bytes`): public (1) and private (5). Unbilled git files (6) count toward neither; the headline is the total
buckets:
  open-athena:
    label: open-athena
    path: ""
    quota:
      - {bytes: 253 TB, name: 253 TB public, short: 253T public, classes: [1]}
      - {bytes: 5.1 TB, name: 5.1 TB private, short: 5.1T private, classes: [5]}
prices: {}
