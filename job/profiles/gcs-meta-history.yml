# gcs-meta.yml for the REPROC re-cut of the meta scans 2026-09-30T2226 → 2026-10-13T0901 (cw's old meta job wrote
# them with cw's `oa-cw-s3-usage-index` as a second root): the data bucket alone, so each re-cut index drops that root
# gcs.oa.dev's "data behind this site" store (`STORES_JSON` `meta`, served at /meta): the deployment's own derived
# storage — its GCS data bucket (listings, path indexes, snapshots, access logs, Nextflow work) and its R2 serving
# bucket — scanned through the same scan.nf as `job/profiles/gcs.yml` (`dt-cloud scan head job/profiles/gcs-meta.yml`;
# upstream's example: `cloud/tests/fixtures/scan_profiles/meta-store.yml`). Its own layout, static-names generation,
# store and Nextflow session namespace (`disky/gcs/meta/scan/<scan>`).
deployment: gcs
store: meta
executor:
  kind: google-batch
  project: oa-internal-450019
  region: us-central1
  service_account: gcs-usage-job@oa-internal-450019.iam.gserviceaccount.com
  image: us-central1-docker.pkg.dev/oa-internal-450019/cloud-run-source-deploy/gcs-usage-snapshot:latest
  boot_disk: 50
work: gs://oa-gcs-usage-dvx/nf
data: gs://oa-gcs-usage-dvx
layout:
  layer2: meta-l2/{scan}/
  snapshots: meta
  listing: meta-listing/{scan}/
# ~160K objects in the data bucket (2026-10-18), against the marin buckets' ~400M: small machines throughout
sources:
  - gcs://oa-gcs-usage-dvx
machines:
  small: e2-standard-2
  medium: e2-standard-4
  big: {type: e2-standard-8, disk: 100}
  list: e2-standard-4
  post: e2-standard-4
skip: [bucket-check, interval-store, over-time, warm-cache, probe, digest, index-gc]
secrets:
  SLACK_BOT_TOKEN: gcs-alert-slack-bot-token
  CLOUDFLARE_API_TOKEN: cf-pages-token
  R2_ACCESS_KEY_ID: gcs-static-index-r2-key-id
  R2_SECRET_ACCESS_KEY: gcs-static-index-r2-secret
  SITE_TOKEN: gcs-snapshot-site-token
env:
  SCAN_RUNS_PROFILE: /app/job/scan-runs.json
  SITE_URL: https://gcs.oa.dev
  GCP_PROJECT: oa-internal-450019
  D1_DB_ID: e52398b7-5538-4bc4-83db-3355a1b5ef9a
  D1_DB_NAME: oa-gcs-usage-auth
  SLACK_ALERT_CHANNEL: C0C579HNRFB  # #gcs-admin
  CLOUDFLARE_ACCOUNT_ID: 74981a43be0de7712369306c7b19133d
  R2_ENDPOINT: https://74981a43be0de7712369306c7b19133d.r2.cloudflarestorage.com
  R2_BUCKET: oa-gcs-usage-index
  AWS_DEFAULT_REGION: auto
  AWS_EC2_METADATA_DISABLED: "true"
pass: [DT_RECORD, DT_ALERTS, DISKY_LABELS]
labels: {deployment: gcs}
options:
  index:
    mode: path-index
    args: [-U]
    mem: 12GB
    age_pyramids: true
    verify: true
  static-names: {gen: 2026-10-18meta, build_args: [-x, "16,8"]}
  index-sync:
    variants: [path, bysize, age-pyramid-1h, age-pyramid-3h, age-pyramid-6h, age-pyramid-12h, age-pyramid-1d,
               age-pyramid-2d, age-pyramid-4d, age-pyramid-8d]
