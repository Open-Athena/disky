# `_GIT_SHA` / `_GIT_DIRTY` (from `job/r2-scan build`) stamp the image with its source revision (Dockerfile `ARG`s →
# labels + env); a build without them is refused.
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        case "$_GIT_SHA" in
          [0-9a-f]*) ;;
          *) echo "refusing an unstamped build: run job/r2-scan build (it passes _GIT_SHA/_GIT_DIRTY)" >&2; exit 1 ;;
        esac
        case "$_GIT_DIRTY" in
          0|1) ;;
          *) echo "_GIT_DIRTY must be 0 or 1, got '$_GIT_DIRTY'" >&2; exit 1 ;;
        esac
        docker build -f job/Dockerfile \
          --build-arg "DISKY_GIT_SHA=$_GIT_SHA" \
          --build-arg "DISKY_GIT_DIRTY=$_GIT_DIRTY" \
          -t "$_IMAGE" .
images: ['${_IMAGE}']
substitutions:
  _GIT_SHA: ""
  _GIT_DIRTY: ""
options:
  logging: CLOUD_LOGGING_ONLY
tags: [disky, oa-r2, scan-image]
timeout: 1200s
