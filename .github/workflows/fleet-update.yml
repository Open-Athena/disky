name: Fleet status update

# The `#disky-admin` fleet post (`specs/disky-oa-dev.md`): hourly, `update` edits the kept message in place, and only
# while `FLEET_POST_ENABLED` is 1. By hand: `dry` prints the message's text without posting, `new` posts a message and
# keeps it (FLEET_KV) for the hourly edits, `update` edits it now.

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry: print the message, post nothing · new: post a message and keep it · update: edit the kept one"
        type: choice
        options: [dry, new, update]
        default: dry

permissions:
  contents: read

concurrency:
  group: disky-oa-fleet-update
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository == 'Open-Athena/disky'
      && (github.event_name == 'workflow_dispatch' || vars.FLEET_POST_ENABLED == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FLEET_JOB_TOKEN: ${{ secrets.FLEET_JOB_TOKEN }}
      MODE: ${{ inputs.mode || 'update' }}
    steps:
      - name: Refresh the persistent fleet post
        run: |
          set -euo pipefail
          test -n "$FLEET_JOB_TOKEN"
          case "$MODE" in dry) query='?dry=1' ;; new) query='?new=1' ;; update) query='' ;; *) echo "mode: $MODE"; exit 1 ;; esac
          mkdir -p tmp
          # No redirects or response dump: the response carries a signed private-card URL, which never reaches the log.
          curl --silent --show-error --fail --max-time 90 \
            --request POST --header "Authorization: Bearer $FLEET_JOB_TOKEN" \
            --output tmp/fleet-update.json "https://disky.oa.dev/api/fleet/slack$query"
          python - <<'EOF'
          import json
          from pathlib import Path
          data = json.loads(Path("tmp/fleet-update.json").read_text())
          if data.get("action") == "dry":
              print(data["text"])
              for block in data["blocks"]:
                  if block["type"] == "section":
                      print(block["text"]["text"])
                  elif block["type"] == "context":
                      print(" ".join(e["text"] for e in block["elements"]))
                  elif block["type"] == "image":
                      print(f"[image: {block['alt_text']}]")
          else:
              print(json.dumps({k: data[k] for k in ("action", "channel", "ts")}))
          EOF
          rm tmp/fleet-update.json
