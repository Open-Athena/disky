# Private deployment config. Install this deployment's own secrets before deploy.
name = "oa-r2-usage"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-08"
compatibility_flags = ["enable_request_signal"]

[[kv_namespaces]]
binding = "CACHE_KV"
id = "30572c48b81a4950883ff11f1d9a5c59"

[[d1_databases]]
binding = "DB"
database_name = "oa-r2-usage-db"
database_id = "3bd87725-4f09-4316-877c-d089563a992e"

[observability]
enabled = true

[vars]
STORE = "oa-r2"
STORES_EXTRA = "meta"
STORES_JSON = '{"meta":{"vars":{"ROOT_LABEL":"OA R2 metadata","SNAPSHOTS_SUBDIR":"meta","STORE_SCHEME":"r2://","STORE_BUCKETS":"oa-r2-usage-data,oa-r2-usage-index","STORE_PREFIXES":"meta-l2/,snapshots/meta/","STORE_BUCKET":"oa-r2-usage-index","STORE_REGION":"auto","ROOT_TITLE":"This deployment’s scan archive and serving indexes","STATIC_GEN":"2026-10-15metab","FILTER_STATIC_HEAVY":"1"},"secrets":{"STORE_ENDPOINT":"STORE_ENDPOINT","STORE_ACCESS_KEY_ID":"STORE_ACCESS_KEY_ID","STORE_SECRET_ACCESS_KEY":"STORE_SECRET_ACCESS_KEY"}},"all":{"union":["primary","meta"],"main":true,"sources":{"primary":{"label":"R2 buckets","icon":"/icons/r2.svg"},"meta":{"label":"Scan metadata","icon":"/icons/meta.svg"}}}}'
META_TREE_URL = "https://r2.oa.dev/meta"
AUTH_MODE = "app"
ROOT_LABEL = "Open Athena R2"
MARK = "r2"
OG_DEFAULT_COLOR = "w"
BASE_SCOPE = "oa-r2"
STORE_SCHEME = "r2://"
STORE_BUCKETS = "marin-na,marin-discord,oa-cw-s3-usage-index,oa-gcs-usage-index"
STORE_BUCKET = "oa-r2-usage-index"
STORE_REGION = "auto"
STORE_PREFIXES = "listing/,snapshots/r2/"
SNAPSHOTS_SUBDIR = "r2"
FILTER_INDEXED_ONLY = "1"
PROD_HOST = "r2.oa.dev"
DEV_HOST = "dev.r2.oa.dev"
VIEWER_DOMAINS = "openathena.ai"
STAFF_DOMAIN = ""
ADMIN_EMAILS = "1"
DISKY_LABELS = "app=disky,deployment=oa-r2"
GCP_PROJECT = "oa-internal-450019"
REPO_URL = "https://github.com/Open-Athena/marin-gcs-usage"

# `?f=` and /names read the static name index from INDEX_R2 (`static-names/<STATIC_GEN>/`; meta's own generation
# in its STORES_JSON vars), and the primary's views read the interval store's current generation
# (`interval-store/CURRENT.json`; unpinned, so the job's compactions are followed without a deploy).
# `job/r2-scan` builds both on its first run (`submit -i` without a scan) and appends each later scan.
FILTER_STATIC = "1"
STATIC_GEN = "2026-10-15r2b"
FILTER_STATIC_HEAVY = "1"
PATH_STORE = "intervals"

[[r2_buckets]]
binding = "INDEX_R2"
bucket_name = "oa-r2-usage-index"

# No PUBLIC_READ, source credentials or sweep executor.
# Required private secrets before deployment:
# SESSION_SECRET, a sign-in transport, and STORE_ENDPOINT / STORE_ACCESS_KEY_ID /
# STORE_SECRET_ACCESS_KEY from the index-reader token, not the publisher token.
