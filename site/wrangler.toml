# Private deployment config. Install this deployment's own secrets before deploy.
name = "oa-r2-usage"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-08"
compatibility_flags = ["enable_request_signal"]

[[kv_namespaces]]
binding = "CACHE_KV"
id = "30572c48b81a4950883ff11f1d9a5c59"

[[d1_databases]]
binding = "DB"
database_name = "oa-r2-usage-db"
database_id = "3bd87725-4f09-4316-877c-d089563a992e"

# Usage attribution (`_lib/usage.ts`, specs/usage-metrics.md): one point per Functions request.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "disky_usage_r2"

[observability]
enabled = true

[vars]
PEERS = '[{"label": "GCS usage", "prod": "gcs.oa.dev", "dev": "dev.gcs.oa.dev", "owners": true, "staging": true, "meta": true}, {"label": "CoreWeave usage", "prod": "cw.oa.dev", "dev": "dev.cw.oa.dev", "staging": true, "meta": true}, {"label": "Hugging Face usage", "prod": "hf.oa.dev", "dev": "dev.hf.oa.dev", "meta": true}, {"label": "R2 usage", "prod": "r2.oa.dev", "dev": "dev.r2.oa.dev", "meta": true}]'
STORE = "oa-r2"
STORES_EXTRA = "meta"
STORES_JSON = '{"meta":{"path":"/meta","vars":{"ROOT_LABEL":"OA R2 disky metadata","SNAPSHOTS_SUBDIR":"meta","STORE_SCHEME":"r2://","STORE_BUCKETS":"oa-r2-usage-data,oa-r2-usage-index","STORE_PREFIXES":"meta-l2/,snapshots/meta/","STORE_BUCKET":"oa-r2-usage-index","STORE_REGION":"auto","ROOT_TITLE":"This deployment\u2019s scan archive and serving indexes","STATIC_CURRENT_KEY":"static-names/meta-CURRENT.json","FILTER_STATIC_HEAVY":"1","PATH_STORE":"intervals","INTERVAL_STORE_PREFIX":"meta/interval-store","AGE_STORE_PREFIX":"history/meta-age"},"secrets":{"STORE_ENDPOINT":"STORE_ENDPOINT","STORE_ACCESS_KEY_ID":"STORE_ACCESS_KEY_ID","STORE_SECRET_ACCESS_KEY":"STORE_SECRET_ACCESS_KEY"}},"all":{"union":["primary","meta"],"main":true,"sources":{"primary":{"label":"R2 buckets","icon":"/icons/r2.svg"},"meta":{"label":"Scan metadata","icon":"/icons/meta.svg"}}}}'
META_TREE_URL = "https://r2.oa.dev/meta"
AUTH_MODE = "app"
ROOT_LABEL = "Open Athena R2"
MARK = "r2"
OG_DEFAULT_COLOR = "w"
OG_CARDS = "1"
OG_ANONYMOUS = "full"
BASE_SCOPE = "oa-r2"
STORE_SCHEME = "r2://"
STORE_BUCKETS = "marin-na,marin-discord,oa-cw-s3-usage-index,oa-gcs-usage-index"
STORE_BUCKET = "oa-r2-usage-index"
STORE_REGION = "auto"
STORE_PREFIXES = "listing/,snapshots/r2/"
SNAPSHOTS_SUBDIR = "r2"
FILTER_INDEXED_ONLY = "1"
PROD_HOST = "r2.oa.dev"
DEV_HOST = "dev.r2.oa.dev"
PAGES_SUBDOMAIN = "oa-r2-usage.pages.dev"   # `<one label>.<it>` (a deployment hash, the `r2` alias) signs in only via the broker's preview client
AUTH_HOST_COOKIES = "1"          # `__Host-` session/nonce cookies on https
OA_LOGIN_ISSUER = "https://login.oa.dev"   # "Sign in with OA" (specs/oa-login-rp.md): OA's broker
OA_LOGIN_CLIENT_ID = "disky-r2"            # broker client, callbacks https://{,dev.}r2.oa.dev/auth/oa/callback; inert until the secret OA_LOGIN_CLIENT_SECRET is set
VIEWER_DOMAINS = "openathena.ai"
STAFF_DOMAIN = ""
ADMIN_EMAILS = "1"
DISKY_LABELS = "app=disky,deployment=oa-r2"
# Activity posts (`_lib/activity.ts`): #r2-admin, with the production-only Pages secret `SLACK_BOT_TOKEN` (the dev stack has none, so it never posts)
SLACK_ADMIN_CHANNEL = "C0C9U47KTM2"
GCP_PROJECT = "oa-internal-450019"
REPO_URL = "https://github.com/Open-Athena/disky"
SOURCE_REF = "r2"

# `?f=` and /names read the static name index from INDEX_R2 at the generation its lineage's pointer names
# (`STATIC_CURRENT_KEY`; meta's own in its STORES_JSON vars), and the primary's views read the interval store's current
# generation (`interval-store/CURRENT.json`): both unpinned, so the job's compactions are followed without a deploy.
# `job/r2-scan` builds both on its first run (`submit -i` without a scan) and appends each later scan.
FILTER_STATIC = "1"
NAME_SUMMARY_STATIC = "1"
STATIC_CURRENT_KEY = "static-names/primary-CURRENT.json"
FILTER_STATIC_HEAVY = "1"
PATH_STORE = "intervals"
AGE_STORE_PREFIX = "history/primary-age"
CF_ACCOUNT_ID = "74981a43be0de7712369306c7b19133d"
CF_PAGES_SCRIPT = "pages-worker--21097822"   # the project's Functions scripts in the analytics datasets: `<this>-production` / `-preview` (`dt-cloud cf-usage`; the Pages API's `production_script_name`)

[[r2_buckets]]
binding = "INDEX_R2"
bucket_name = "oa-r2-usage-index"

# No PUBLIC_READ, source credentials or sweep executor.
# Required private secrets before deployment:
# SESSION_SECRET, a sign-in transport, and STORE_ENDPOINT / STORE_ACCESS_KEY_ID /
# STORE_SECRET_ACCESS_KEY from the index-reader token, not the publisher token.

# Dev shares the verified age histories; its progressive diff pilot remains independent.
[env.preview.vars]
SWEEP_DISPATCH = "0"
STORE = "oa-r2"
STORES_EXTRA = "meta"
STORES_JSON = "{\"meta\":{\"path\":\"/meta\",\"vars\":{\"ROOT_LABEL\":\"OA R2 disky metadata\",\"SNAPSHOTS_SUBDIR\":\"meta\",\"STORE_SCHEME\":\"r2://\",\"STORE_BUCKETS\":\"oa-r2-usage-data,oa-r2-usage-index\",\"STORE_PREFIXES\":\"meta-l2/,snapshots/meta/\",\"STORE_BUCKET\":\"oa-r2-usage-index\",\"STORE_REGION\":\"auto\",\"ROOT_TITLE\":\"This deployment\\u2019s scan archive and serving indexes\",\"STATIC_CURRENT_KEY\":\"static-names/meta-CURRENT.json\",\"FILTER_STATIC_HEAVY\":\"1\",\"PATH_STORE\":\"intervals\",\"INTERVAL_STORE_PREFIX\":\"meta/interval-store\",\"AGE_STORE_PREFIX\":\"history/meta-age\"},\"secrets\":{\"STORE_ENDPOINT\":\"STORE_ENDPOINT\",\"STORE_ACCESS_KEY_ID\":\"STORE_ACCESS_KEY_ID\",\"STORE_SECRET_ACCESS_KEY\":\"STORE_SECRET_ACCESS_KEY\"}},\"all\":{\"union\":[\"primary\",\"meta\"],\"main\":true,\"sources\":{\"primary\":{\"label\":\"R2 buckets\",\"icon\":\"/icons/r2.svg\"},\"meta\":{\"label\":\"Scan metadata\",\"icon\":\"/icons/meta.svg\"}}}}"
META_TREE_URL = "https://r2.oa.dev/meta"
AUTH_MODE = "app"
ROOT_LABEL = "Open Athena R2"
MARK = "r2"
OG_DEFAULT_COLOR = "w"
OG_CARDS = "1"
OG_ANONYMOUS = "full"
BASE_SCOPE = "oa-r2"
STORE_SCHEME = "r2://"
STORE_BUCKETS = "marin-na,marin-discord,oa-cw-s3-usage-index,oa-gcs-usage-index"
STORE_BUCKET = "oa-r2-usage-index"
STORE_REGION = "auto"
STORE_PREFIXES = "listing/,snapshots/r2/"
SNAPSHOTS_SUBDIR = "r2"
FILTER_INDEXED_ONLY = "1"
PROD_HOST = "r2.oa.dev"
DEV_HOST = "dev.r2.oa.dev"
PAGES_SUBDOMAIN = "oa-r2-usage.pages.dev"   # `<one label>.<it>` (a deployment hash, the `r2` alias) signs in only via the broker's preview client
AUTH_HOST_COOKIES = "1"          # `__Host-` session/nonce cookies on https
OA_LOGIN_ISSUER = "https://login.oa.dev"   # "Sign in with OA" (specs/oa-login-rp.md): OA's broker
OA_LOGIN_CLIENT_ID = "disky-r2"            # broker client, callbacks https://{,dev.}r2.oa.dev/auth/oa/callback; inert until the secret OA_LOGIN_CLIENT_SECRET is set
VIEWER_DOMAINS = "openathena.ai"
STAFF_DOMAIN = ""
ADMIN_EMAILS = "1"
DISKY_LABELS = "app=disky,deployment=oa-r2"
SLACK_ADMIN_CHANNEL = "C0C9U47KTM2"
GCP_PROJECT = "oa-internal-450019"
REPO_URL = "https://github.com/Open-Athena/disky"
SOURCE_REF = "r2"
FILTER_STATIC = "1"
NAME_SUMMARY_STATIC = "1"
STATIC_CURRENT_KEY = "static-names/primary-CURRENT.json"
FILTER_STATIC_HEAVY = "1"
PATH_STORE = "intervals"
CF_ACCOUNT_ID = "74981a43be0de7712369306c7b19133d"
CF_PAGES_SCRIPT = "pages-worker--21097822"
AGE_STORE_PREFIX = "history/primary-age"
DIFF_DESCENT = "1"

[[env.preview.kv_namespaces]]
binding = "CACHE_KV"
id = "30572c48b81a4950883ff11f1d9a5c59"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "oa-r2-usage-db"
database_id = "3bd87725-4f09-4316-877c-d089563a992e"

[[env.preview.r2_buckets]]
binding = "INDEX_R2"
bucket_name = "oa-r2-usage-index"

[[env.preview.analytics_engine_datasets]]
binding = "USAGE"
dataset = "disky_usage_r2"
