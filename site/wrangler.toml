# CF Pages project config (oa-hf-usage → hf.oa.dev): the Hugging Face org `open-athena`'s storage, one store, one
# bucket (the namespace). `wrangler pages deploy` reads this, so the bindings + vars declared here apply to the
# deployment it creates; the job (job/profiles/hf.yml, this file baked into its image) reads its D1 and its static-names /
# interval-store generations from here too, so the two always name the same ones. Sign-in is the app's own (Google
# OIDC + emailed codes, `@open-athena/auth`), Open Athena staff only. Every key: `wrangler.example.toml`.
name = "oa-hf-usage"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"
compatibility_flags = ["enable_request_signal"]  # interval-store reads evict a cancelled request's in-flight fetches

# The index footer (index_schema + index_row_groups), sign-in, grants and scan runs: the cw lineage, applied from
# scratch (`wrangler d1 migrations apply oa-hf-usage-db --remote`). The id is the `d1_database_id` output of the
# `hf` CF stack (infra/cf); a D1 id is not a secret.
[[d1_databases]]
binding = "DB"
database_name = "oa-hf-usage-db"
database_id = "2f83fdf9-509f-491c-9664-04bef9944988"
remote = true   # dev-only: local dev reads the real D1; deploys ignore it

[observability]
enabled = true

[vars]
MARK = "hf"                      # build-time: the 🤗 favicon / touch icons (`public/icons/hf*`, vite.config.ts)
ROOT_LABEL = "Open Athena Hugging Face"   # the store root's crumb label
ROOT_TITLE = "The open-athena org's Storage Buckets and model, dataset and space repos"
# Build time (vite.config.ts): the `src/stores.ts` registry key, and the app's own sign-in.
STORE = "hf"
AUTH_MODE = "app"
PROD_HOST = "hf.oa.dev"
DEV_HOST = "dev.hf.oa.dev"
REPO_URL = "https://github.com/Open-Athena/disky"
OG_CARDS = "1"
OG_ANONYMOUS = "full"            # an anonymous unfurl gets the full card (labelled tiles, sizes; OA-owned data, as cw)
# Who may see it (_lib/auth.ts): Open Athena staff by email domain; `admin_emails` rows (migrations/cw/0001) on top.
BASE_SCOPE = "hf"
STAFF_DOMAIN = "openathena.ai"
ADMIN_EMAILS = "1"
# The plan prefix shape (`_lib/plans.ts`): one "bucket", the namespace. No staging / executor: nothing here deletes.
STORE_SCHEME = "hf://"
STORE_BUCKETS = "open-athena"
STORE_ROOT = "open-athena"       # the one bucket is the site's mount: `/models/…`, not `/open-athena/models/…` (`Store.root`)
SNAPSHOTS_SUBDIR = "hf"          # snapshots/hf/<scan>/ (the scan's `index` step)
# The index store: the R2 bucket the job writes (`r2_bucket` output of the `hf` CF stack), through the S3 seam with
# a read-only key pair (secrets below). Keys under the base's default prefixes (`listing/`, `snapshots/`).
STORE_BUCKET = "oa-hf-usage-index"
STORE_REGION = "auto"
SERVED_R2 = "1"                  # snapshot JSONs + extras through INDEX_R2 (the same bucket), not the S3 seam
# The static name index (the map's `?f=` and /names), in INDEX_R2 under `static-names/<gen>/`: the generation
# STATIC_CURRENT_KEY names (no STATIC_GEN pin). Each scan appends to it (`add`); compaction moves the pointer.
FILTER_INDEXED_ONLY = "1"        # search is the static name index only: a form it can't answer is refused, never walked
FILTER_STATIC = "1"
NAME_SUMMARY_STATIC = "1"
FILTER_STATIC_HEAVY = "1"
STATIC_CURRENT_KEY = "static-names/primary-CURRENT.json"
# The interval store, in INDEX_R2 under `interval-store/<gen>/`: built by the job's first run, then one `add` per scan,
# which compacts it into a new generation every 2^5 scans and moves `interval-store/CURRENT.json` to it. No
# INTERVAL_STORE_GEN: the site serves the generation CURRENT.json names (`ivGen`); setting one pins it (and the job then
# appends without compacting). `intervals`: the Map's path store, since the first scan's parity check
# (`interval-store verify`, 11/11 views equal; 2026-10-15).
PATH_STORE = "intervals"
AGE_STORE_PREFIX = "history/primary-age"
# The "data behind this site" store at /meta (`src/stores/meta.ts`; job/profiles/hf-meta.yml scans it daily): the data
# bucket (GCS) and this R2 bucket, its layer-2s under `meta-l2/`, its snapshots under `snapshots/meta/`, its own static
# name index generation; read through the primary's R2 secrets. The /scans page links its outputs into it.
STORES_EXTRA = "meta"
STORES_JSON = '{"meta":{"path":"/meta","vars":{"ROOT_LABEL":"OA Hugging Face disky metadata","SNAPSHOTS_SUBDIR":"meta","STORE_SCHEME":"r2://","STORE_BUCKETS":"oa-hf-usage-data,oa-hf-usage-index","STORE_PREFIXES":"meta-l2/,snapshots/meta/","STORE_BUCKET":"oa-hf-usage-index","STORE_REGION":"auto","ROOT_TITLE":"The data behind this site: scans, indexes and listings in oa-hf-usage-data (GCS) and oa-hf-usage-index (R2)","FILTER_STATIC_HEAVY":"1","STATIC_CURRENT_KEY":"static-names/meta-CURRENT.json","PATH_STORE":"intervals","INTERVAL_STORE_PREFIX":"history/meta/interval-store","AGE_STORE_PREFIX":"history/meta-age"},"secrets":{"STORE_ENDPOINT":"STORE_ENDPOINT","STORE_ACCESS_KEY_ID":"STORE_ACCESS_KEY_ID","STORE_SECRET_ACCESS_KEY":"STORE_SECRET_ACCESS_KEY"}}}'
META_TREE_URL = "https://hf.oa.dev/meta"

# The static name index and the snapshot JSONs, read through a native binding (the S3 seam's keys are for the path
# store; this is the same bucket).
[[r2_buckets]]
binding = "INDEX_R2"
bucket_name = "oa-hf-usage-index"

# The global cache tier behind each colo's cache (`_lib/edgeCache.ts`): the `cache_kv_id` output of the `hf` CF stack.
[[kv_namespaces]]
binding = "CACHE_KV"
id = "db204aed0ef5440f8d450184cc7c177a"

# Secrets (`infra/cf/hf-secrets -P`, or `wrangler pages secret put <NAME> --project-name oa-hf-usage`):
#   STORE_ENDPOINT          = https://<account id>.r2.cloudflarestorage.com (kept out of git with the account id)
#   STORE_ACCESS_KEY_ID     = the `site_r2_access_key_id` output (a read-only token on the bucket)
#   STORE_SECRET_ACCESS_KEY = the `site_r2_secret_access_key` output
#   SESSION_SECRET          = HMAC key for session cookies (absent = sign-in 503s)
#   RESEND_API_KEY / MAIL_FROM — emailed-code sign-in
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET — the "hf.oa.dev" OAuth Web client

# The dev stack (`site/deploy --dev` → branch `dev` → dev.hf.oa.dev, the `branchAliases` CNAME in `infra/cf`): the
# SAME D1, bucket and cache as prod (a write on dev is a prod write), its own cache namespace. Wrangler envs don't
# inherit bindings or vars, so this repeats them; keep it in step with the blocks above.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "oa-hf-usage-db"
database_id = "2f83fdf9-509f-491c-9664-04bef9944988"

[env.preview.vars]
MARK = "hf"
ROOT_LABEL = "Open Athena Hugging Face (dev)"
CACHE_NS = "dev.hf.oa.dev"
ROOT_TITLE = "The open-athena org's Storage Buckets and model, dataset and space repos"
STORE = "hf"
AUTH_MODE = "app"
PROD_HOST = "hf.oa.dev"
DEV_HOST = "dev.hf.oa.dev"
REPO_URL = "https://github.com/Open-Athena/disky"
OG_CARDS = "1"
OG_ANONYMOUS = "full"
BASE_SCOPE = "hf"
STAFF_DOMAIN = "openathena.ai"
ADMIN_EMAILS = "1"
STORE_SCHEME = "hf://"
STORE_BUCKETS = "open-athena"
STORE_ROOT = "open-athena"
SNAPSHOTS_SUBDIR = "hf"
STORE_BUCKET = "oa-hf-usage-index"
STORE_REGION = "auto"
SERVED_R2 = "1"
FILTER_INDEXED_ONLY = "1"
FILTER_STATIC = "1"
NAME_SUMMARY_STATIC = "1"
FILTER_STATIC_HEAVY = "1"
STATIC_CURRENT_KEY = "static-names/primary-CURRENT.json"
PATH_STORE = "intervals"
AGE_STORE_PREFIX = "history/primary-age"
STORES_EXTRA = "meta"
STORES_JSON = '{"meta":{"path":"/meta","vars":{"ROOT_LABEL":"OA Hugging Face disky metadata","SNAPSHOTS_SUBDIR":"meta","STORE_SCHEME":"r2://","STORE_BUCKETS":"oa-hf-usage-data,oa-hf-usage-index","STORE_PREFIXES":"meta-l2/,snapshots/meta/","STORE_BUCKET":"oa-hf-usage-index","STORE_REGION":"auto","ROOT_TITLE":"The data behind this site: scans, indexes and listings in oa-hf-usage-data (GCS) and oa-hf-usage-index (R2)","FILTER_STATIC_HEAVY":"1","STATIC_CURRENT_KEY":"static-names/meta-CURRENT.json","PATH_STORE":"intervals","INTERVAL_STORE_PREFIX":"history/meta/interval-store","AGE_STORE_PREFIX":"history/meta-age"},"secrets":{"STORE_ENDPOINT":"STORE_ENDPOINT","STORE_ACCESS_KEY_ID":"STORE_ACCESS_KEY_ID","STORE_SECRET_ACCESS_KEY":"STORE_SECRET_ACCESS_KEY"}}}'
META_TREE_URL = "https://dev.hf.oa.dev/meta"

[[env.preview.r2_buckets]]
binding = "INDEX_R2"
bucket_name = "oa-hf-usage-index"

[[env.preview.kv_namespaces]]
binding = "CACHE_KV"
id = "db204aed0ef5440f8d450184cc7c177a"
